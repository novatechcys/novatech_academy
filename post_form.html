{% extends "base.html" %}
{% block title %}بەڕێوەبردنی وانە{% endblock %}
{% block content %}
<section class="form-card wide-form">
    <h1>{{ 'دەستکاری وانە' if post else 'زیادکردنی وانە' }}</h1>

    {% if categories %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="category_id">بەش</label>
            <select id="category_id" name="category_id" required>
                <option value="">بەش هەڵبژێرە</option>
                {% for category in categories %}
                    <option value="{{ category.id }}"
                        {% if post and post.category_id == category.id %}selected{% endif %}>
                        {{ category.name }}
                    </option>
                {% endfor %}
            </select>

            <label for="title">ناونیشانی وانە</label>
            <input id="title" name="title" type="text" maxlength="200"
                   required value="{{ post.title if post else '' }}">

            <label for="content">ناوەڕۆکی وانە</label>
            <textarea id="content" name="content" rows="12"
                      maxlength="100000" required>{{ post.content if post else '' }}</textarea>

            <button class="primary-button" type="submit">پاشەکەوتکردن</button>
        </form>
    {% else %}
        <p class="empty-state">پێش زیادکردنی وانە، بەشێک زیاد بکە.</p>
        <a class="primary-button" href="{{ url_for('new_category') }}">زیادکردنی بەش</a>
    {% endif %}
</section>
{% endblock %}
