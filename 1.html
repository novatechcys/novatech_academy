
<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nova Tech Academy">
    <title>{% block title %}Nova Tech Academy{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body>
<div class="site-shell">
    <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}">
            <span class="brand-mark">NT</span>
            <span class="brand-name">Nova Tech<br>Academy</span>
        </a>

        <button class="menu-toggle" type="button"
                aria-label="کردنەوەی لیستی بەستەرەکان"
                aria-expanded="false">☰</button>

        <nav class="main-nav">
            <a href="{{ url_for('index') }}">سەرەکی</a>
            <a href="{{ url_for('index') }}#categories">بەشەکان</a>
            <a href="{{ url_for('index') }}#about">دەربارە</a>
            <a href="{{ url_for('index') }}#contact">پەیوەندی</a>
        </nav>
    </header>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-area" aria-live="polite">
                {% for message in messages %}
                    <p class="flash-message">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Nova Tech Academy</p>
    </footer>
</div>
</body>
</html>
